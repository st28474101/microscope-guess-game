<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顯微鏡猜猜樂｜老師控制台</title><link rel="stylesheet" href="style.css"><body data-mode="teacher"><header><h1>🔐 顯微鏡猜猜樂｜老師控制台</h1><p>整合五班題目。可公布／隱藏單張題目答案，或一次公布全部已填答案。</p></header><main><div class="notice" id="offline">Firebase 尚未設定：目前只能預覽照片，不能同步公布答案。</div><div id="login" class="hidden"><input id="email" type="email" placeholder="老師 Firebase 登入信箱"><input id="password" type="password" placeholder="密碼"><button id="signIn">登入</button><button id="signOut" class="alt hidden">登出</button><span id="status"></span></div><div class="toolbar"><a href="add-question.html" style="padding:10px 13px;border-radius:9px;background:#def8e9;color:#175b35;text-decoration:none;font-weight:bold">＋ 補交／新增題目</a><a href="answer-photos.html" style="padding:10px 13px;border-radius:9px;background:#e7f3fa;color:#164b66;font-weight:700;text-decoration:none">📷 上傳／管理答案照片</a> <a href="batch-answers.html" style="padding:10px 13px;border-radius:9px;background:#e7f3fa;color:#164b66;font-weight:700;text-decoration:none">📚 批次上傳答案照片</a> <a href="drag-answers.html" style="padding:10px 13px;border-radius:9px;background:#ddf6e8;color:#17613a;font-weight:700;text-decoration:none">🖐 拖曳配對答案照片</a><label>班級 <select id="classFilter"></select></label><label>座號 <select id="seat"></select></label><span id="count"></span><button id="hideAll" class="alt">全部重新隱藏</button><button id="revealAll">公布所有已填的答案</button></div><div id="cards" class="grid"></div><p class="small">文字答案先保存在目前這台老師電腦的瀏覽器中；上傳的答案照片會另外保存到 Firebase 的教師私密區。切換題目後會自動恢復你先前已輸入的文字答案。</p></main><dialog id="zoom"><button id="closeZoom">關閉</button><p><img id="zoomimg" alt="放大照片"></p></dialog><script src="data.js?v=20261031b"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="common.js?v=20261031c"></script><script>
init();
if(dbReady)firebase.database().ref('live/extraQuestions').on('value',snap=>{
const extra=Object.values(snap.val()||{});
window.PHOTOS.splice(0,window.PHOTOS.length,...window.PHOTOS.filter(p=>!p.dynamic),...extra.map(p=>({...p,dynamic:true})));window.PHOTOS.sort((a,b)=>a.seat.localeCompare(b.seat)||Number(a.id.split('_').pop())-Number(b.id.split('_').pop()));
const cls=$('#classFilter')?.value,seat=$('#seat')?.value;
classOptions();if(cls&&[...$('#classFilter').options].some(o=>o.value===cls))$('#classFilter').value=cls;
seatOptions();if(seat&&[...$('#seat').options].some(o=>o.value===seat))$('#seat').value=seat;
photoCards(true);if(window.afterCardsRendered)window.afterCardsRendered();
},error=>console.warn('新增題目尚未取得讀取權限：',error.message));

function restore(){document.querySelectorAll('.answer-input').forEach(el=>el.value=localStorage.getItem(el.id)||'');}
window.afterCardsRendered=restore;
restore();
$('#cards').addEventListener('input',e=>{if(e.target.matches('.answer-input'))localStorage.setItem(e.target.id,e.target.value)});
function msg(s){$('#status').textContent=s}
async function op(id,show){
 if(!dbReady)return alert('請先設定 Firebase');
 if(!firebase.auth().currentUser)return alert('請先登入老師帳號');
 const answerRef=firebase.database().ref('live/revealed/'+id);
 const imageRef=firebase.database().ref('live/answerImages/'+id);
 if(show){
   const answer=$('#a_'+id).value.trim();
   let photo=null;
   try{const s=await firebase.database().ref('private/answerImages/'+id).once('value');photo=s.val()}catch(e){console.warn('照片資料尚未開通',e.message)}
   if(!answer&&!photo)return alert('請先輸入文字答案，或到「答案照片管理」上傳照片');
   if(answer)await answerRef.set(answer);else await answerRef.remove();
   if(photo)await imageRef.set(photo);
   msg('已公布'+(photo?'文字及照片答案':'文字答案'));
 }else{
   await answerRef.remove();
   try{await imageRef.remove();msg('文字和照片答案已隱藏')}
   catch(e){msg('文字已隱藏；照片隱藏失敗，請檢查資料庫規則：'+e.message)}
 }
}
$('#cards').addEventListener('click',e=>{let id=e.target.dataset.reveal||e.target.dataset.hide;if(id)op(id,!!e.target.dataset.reveal).catch(e=>alert(e.message));});
$('#cards').addEventListener('click',async e=>{const id=e.target.dataset.questionToggle;if(!id)return;if(!firebase.auth().currentUser)return alert('請先登入');const removing=!window.hiddenQuestionIds[id];if(!confirm(removing?'將這張錯題從學生畫面隱藏？照片與答案都會保留，可隨時恢復。':'恢復這張題目供學生猜題？'))return;try{const r=firebase.database().ref('live/hiddenQuestions/'+id);if(removing)await r.set(true);else await r.remove();msg(removing?'錯題已從學生畫面隱藏':'題目已恢復');}catch(err){alert(err.message)}});
if(dbReady)firebase.database().ref('live/hiddenQuestions').on('value',s=>{window.hiddenQuestionIds=s.val()||{};photoCards(true);restore();},e=>msg('錯題管理待設定規則：'+e.message));
$('#hideAll').onclick=async()=>{
 if(!confirm('確定重新隱藏所有文字與照片答案，供下一班使用？'))return;
 if(!dbReady)return alert('請先設定 Firebase');
 if(!firebase.auth().currentUser)return alert('請先登入老師帳號');
 try{
  await firebase.database().ref('live/revealed').remove();
  try{await firebase.database().ref('live/answerImages').remove();msg('所有文字及照片答案已重新隱藏')}
  catch(e){msg('文字答案已隱藏；照片尚未隱藏：'+e.message)}
 }catch(e){alert(e.message)}
};
$('#revealAll').onclick=async()=>{
 if(!confirm('確定公布所有已輸入的文字答案，以及已上傳的答案照片？'))return;
 if(!dbReady)return alert('請先設定 Firebase');
 if(!firebase.auth().currentUser)return alert('請先登入老師帳號');
 const data={};
 window.PHOTOS.forEach(p=>{const x=localStorage.getItem('a_'+p.id);if(x?.trim())data[p.id]=x.trim()});
 try{
  await firebase.database().ref('live/revealed').set(data);
  let n=0;
  try{
   const s=await firebase.database().ref('private/answerImages').once('value');
   const photos=s.val()||{};
   n=Object.keys(photos).length;
   if(n)await firebase.database().ref('live/answerImages').set(photos);
  }catch(e){msg('文字已公布，但照片無法公布：'+e.message);return}
  msg('已同步公布 '+Object.keys(data).length+' 個文字答案及 '+n+' 張答案照片');
 }catch(e){alert(e.message)}
};
if(dbReady){$('#offline').classList.add('hidden');$('#login').classList.remove('hidden');firebase.auth().onAuthStateChanged(user=>{$('#signOut').classList.toggle('hidden',!user);msg(user?'已登入：'+user.email:'尚未登入')});$('#signIn').onclick=async()=>{try{await firebase.auth().signInWithEmailAndPassword($('#email').value,$('#password').value);restore()}catch(e){alert(e.message)}};$('#signOut').onclick=()=>firebase.auth().signOut();}

 firebase.database().ref('live/questionOverrides').on('value',snap=>{
 const overrides=snap.val()||{};
 window.PHOTOS.forEach(p=>{if(!p.originalSrc)p.originalSrc=p.src;p.src=overrides[p.id]||p.originalSrc;});
 photoCards(true);if(window.afterCardsRendered)window.afterCardsRendered();
 },err=>console.warn('題目照片替換尚未啟用：'+err.message));
</script></body></html>
