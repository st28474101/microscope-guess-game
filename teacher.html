<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>704 顯微鏡猜猜樂｜老師控制台</title><link rel="stylesheet" href="style.css"><body data-mode="teacher"><header><h1>🔐 704 顯微鏡猜猜樂｜老師控制台</h1><p>老師登入後可公布、隱藏單張照片答案，或一次隱藏全部答案。</p></header><main><div class="notice" id="offline">Firebase 尚未設定：目前只能預覽照片，不能同步公布答案。</div><div id="login" class="hidden"><input id="email" type="email" placeholder="老師 Firebase 登入信箱"><input id="password" type="password" placeholder="密碼"><button id="signIn">登入</button><button id="signOut" class="alt hidden">登出</button><span id="status"></span></div><div class="toolbar"><label>座號 <select id="seat"></select></label><span id="count"></span><button id="hideAll" class="alt">全部重新隱藏</button><button id="revealAll">公布所有已填的答案</button></div><div id="cards" class="grid"></div><p class="small">正式使用時，請只用教師帳號登入；未設定 Firebase 前，控制按鈕不會將內容同步給學生。答案輸入先存於此瀏覽器，登入後公布時才送出。</p></main><dialog id="zoom"><button id="closeZoom">關閉</button><p><img id="zoomimg" alt="放大照片"></p></dialog><script src="data.js"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="common.js"></script><script>init();function saveInputs(){document.querySelectorAll('.answer-input').forEach(el=>localStorage.setItem(el.id,el.value));}function restore(){document.querySelectorAll('.answer-input').forEach(el=>el.value=localStorage.getItem(el.id)||'');}restore();$('#seat').addEventListener('change',()=>setTimeout(restore,0));$('#cards').addEventListener('input',e=>{if(e.target.matches('.answer-input'))localStorage.setItem(e.target.id,e.target.value)});function msg(s){$('#status').textContent=s}async function op(id,show){if(!dbReady)return alert('請先設定 Firebase');if(!firebase.auth().currentUser)return alert('請先登入老師帳號');let ref=firebase.database().ref('live/revealed/'+id);if(show){const answer=$('#a_'+id).value.trim();if(!answer)return alert('請先輸入答案');await ref.set(answer)}else await ref.remove();msg(show?'已公布':'已隱藏')}$('#cards').addEventListener('click',e=>{let id=e.target.dataset.reveal||e.target.dataset.hide;if(id)op(id,!!e.target.dataset.reveal).catch(e=>alert(e.message));});$('#hideAll').onclick=async()=>{if(!confirm('確定重新隱藏所有答案，供下一班使用？'))return;if(!dbReady)return alert('請先設定 Firebase');if(!firebase.auth().currentUser)return alert('請先登入老師帳號');try{await firebase.database().ref('live/revealed').remove();msg('所有答案已重新隱藏')}catch(e){alert(e.message)}};$('#revealAll').onclick=async()=>{if(!confirm('確定將所有已輸入答案的照片公開？'))return;if(!dbReady)return alert('請先設定 Firebase');if(!firebase.auth().currentUser)return alert('請先登入老師帳號');const data={};window.PHOTOS.forEach(p=>{const x=localStorage.getItem('a_'+p.id);if(x?.trim())data[p.id]=x.trim()});try{await firebase.database().ref('live/revealed').set(data);msg('已同步公布 '+Object.keys(data).length+' 題')}catch(e){alert(e.message)}};if(dbReady){$('#offline').classList.add('hidden');$('#login').classList.remove('hidden');firebase.auth().onAuthStateChanged(user=>{$('#signOut').classList.toggle('hidden',!user);msg(user?'已登入：'+user.email:'尚未登入')});$('#signIn').onclick=async()=>{try{await firebase.auth().signInWithEmailAndPassword($('#email').value,$('#password').value)}catch(e){alert(e.message)}};$('#signOut').onclick=()=>firebase.auth().signOut();}</script></body></html>
