<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顯微鏡猜猜樂｜老師作業總覽</title><link rel="stylesheet" href="style.css"><style>main{max-width:1100px}.panel{background:#fff;padding:18px;border-radius:13px;margin:14px 0}.toolbar2{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.toolbar2 input{max-width:200px}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #d9e4eb;text-align:left}th{background:#eef4f8}tr:hover{background:#f6fafc}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:12px 15px;background:#eef4f9;border-radius:10px}.warn{color:#9a4a00}.ok{color:#167048}.bad{color:#b42318}.muted{font-size:13px;color:#506577}.mini{display:block;font-size:12px;color:#617583}a{color:#176087}@media(max-width:600px){th,td{padding:6px;font-size:13px}.toolbar2 input{max-width:100%}}</style></head><body><header><h1>📋 顯微鏡猜猜樂｜作業總覽</h1><p>固定座號 01–09、21–32｜檢查題目、答案配對與補交狀態</p><a href="portal.html" style="color:white">← 返回教材入口</a></header><main><section class="panel"><div class="toolbar2"><input id="email" type="email" placeholder="Firebase 教師 Email"><input id="password" type="password" placeholder="登入密碼"><button id="login">登入</button><button id="logout" class="alt" hidden>登出</button><span id="authStatus">尚未登入</span></div></section><section class="panel" id="manage" hidden><div class="toolbar2"><label>班級 <select id="cls"></select></label><label>篩選 <select id="filter"><option value="all">全部學生</option><option value="missing">沒有題目</option><option value="answers">缺答案照片</option><option value="hidden">題目全部隱藏</option><option value="complete">題目及答案完整</option></select></label><button id="refresh" class="alt">重新整理統計</button></div><div id="stats" class="stats" style="margin:13px 0"></div><p class="muted">答案統計以 Firebase「老師私密保存的答案照片」為準，未公布也算已配對。文字答案不納入本表。已隱藏的題目不算學生可看到的有效題目。</p><div style="overflow-x:auto"><table><thead><tr><th>座號</th><th>題目數</th><th>答案照片</th><th>狀態</th><th>處理</th></tr></thead><tbody id="rows"></tbody></table></div><p id="notice" class="muted" aria-live="polite"></p></section></main>
<script src="data.js?v=20261031b"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>
'use strict';firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.database(),E=id=>document.getElementById(id);
let extra={},hidden={},answers={},ready=false;const seats=[...Array.from({length:9},(_,i)=>String(i+1).padStart(2,'0')),...Array.from({length:12},(_,i)=>String(i+21))];['701','702','703','704','705'].forEach(c=>E('cls').add(new Option(c+' 班',c)));
function snapshot(){return [...window.PHOTOS,...Object.values(extra)].sort((a,b)=>a.seat.localeCompare(b.seat)||Number(a.id.split('_').pop())-Number(b.id.split('_').pop()))}
function build(){if(!ready)return;const cls=E('cls').value;const data=snapshot();const stats=seats.map(n=>{let seat=cls+n,p=data.filter(x=>x.seat===seat),visible=p.filter(x=>!hidden[x.id]),paired=p.filter(x=>!!answers[x.id]),visiblePaired=visible.filter(x=>!!answers[x.id]);let state=p.length===0?'沒有題目':visible.length===0?'題目全部隱藏':visiblePaired.length<visible.length?'缺答案照片':'完成';return {seat,p,visible,paired,visiblePaired,state}});const totals={missing:stats.filter(x=>x.state==='沒有題目').length,answers:stats.filter(x=>x.state==='缺答案照片').length,hidden:stats.filter(x=>x.state==='題目全部隱藏').length,complete:stats.filter(x=>x.state==='完成').length};E('stats').replaceChildren();for(const [label,n] of [['學生',seats.length],['未交題目',totals.missing],['缺答案照片',totals.answers],['題目全隱藏',totals.hidden],['已完成',totals.complete]]){let b=document.createElement('div');b.className='stat';b.textContent=label+'：'+n;E('stats').append(b)}const f=E('filter').value;E('rows').replaceChildren();for(const a of stats){if(f==='missing'&&a.state!=='沒有題目'||f==='answers'&&a.state!=='缺答案照片'||f==='hidden'&&a.state!=='題目全部隱藏'||f==='complete'&&a.state!=='完成')continue;let tr=document.createElement('tr');const cell=t=>{let td=document.createElement('td');td.textContent=t;tr.append(td);return td};cell(a.seat);cell(a.p.length+' 張（公開 '+a.visible.length+'）');cell(a.visiblePaired.length+'/'+a.visible.length+' 張');let st=cell(a.state);st.className=a.state==='完成'?'ok':a.state==='缺答案照片'?'warn':'bad';const tools=document.createElement('td');for(const [text,url] of [['新增題目','add-question.html'],['更換照片','replace-question.html'],['配對答案','drag-answers.html'],['公布管理','teacher.html']]){let link=document.createElement('a');link.href=url;link.textContent=text;link.style.cssText='display:inline-block;margin-right:9px;white-space:nowrap';tools.append(link)}tr.append(tools);E('rows').append(tr)}E('notice').textContent='本表只根據目前已公開/已儲存資料判斷，不代表學生一定未交作業；請搭配課堂紀錄確認。'}
async function load(){if(!firebase.auth().currentUser)return;E('notice').textContent='讀取資料中…';try{const refs=['live/extraQuestions','live/hiddenQuestions','private/answerImages'];const ss=await Promise.all(refs.map(p=>db.ref(p).once('value')));extra=ss[0].val()||{};hidden=ss[1].val()||{};answers=ss[2].val()||{};ready=true;build()}catch(e){ready=false;E('notice').textContent='讀取失敗：'+e.message+'。請確認帳號權限與資料庫規則。'}}
E('cls').onchange=build;E('filter').onchange=build;E('refresh').onclick=load;
E('login').onclick=async()=>{try{await firebase.auth().signInWithEmailAndPassword(E('email').value.trim(),E('password').value);E('password').value=''}catch(e){alert(e.message)}};E('logout').onclick=()=>firebase.auth().signOut();
firebase.auth().onAuthStateChanged(user=>{E('authStatus').textContent=user?'已登入：'+user.email:'尚未登入';E('manage').hidden=!user;E('login').hidden=!!user;E('logout').hidden=!user;if(user)load();else{ready=false;answers={};E('rows').replaceChildren()}});
</script></body></html>
