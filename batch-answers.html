<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顯微鏡猜猜樂｜答案照片批次配對</title><link rel="stylesheet" href="style.css">
<style>main{max-width:1120px}.panel{padding:16px;background:white;border-radius:13px;margin:14px 0}.pair{display:grid;grid-template-columns:110px 130px 1fr 110px;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding:12px 0}.pair img{width:110px;height:100px;object-fit:contain;background:#f5f6f8;border-radius:8px}.pair select{max-width:100%;width:100%}input[type=file]{width:100%;max-width:100%}.muted{color:#536477;font-size:13px}.toolbar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}@media(max-width:700px){.pair{grid-template-columns:80px 80px 1fr;gap:6px}.pair img{width:80px;height:75px}.pair .status{grid-column:1/-1}}</style>
<header><h1>📚 顯微鏡猜猜樂｜批次上傳答案照片</h1><p>一次選取多張答案照，逐列核對題目後，再全部私密儲存。</p><a href="teacher.html" style="color:white">← 老師控制台</a></header><main>
<section class="panel"><div class="toolbar2"><input id="email" type="email" placeholder="教師 Email"><input id="password" type="password" placeholder="教師密碼"><button id="login">登入</button><button id="logout" class="alt">登出</button><span id="authStatus"></span></div></section>
<section class="panel" id="manage" hidden><h2>1. 選擇班級與答案照片</h2><div class="toolbar2"><label>班級 <select id="class"></select></label><label>答案照片 <input id="files" type="file" accept="image/*" multiple></label></div><p class="muted">檔案名稱可包含完整座號（70403）或在選定班級後包含兩位座號（03），例如 03_答案.jpg；座號有多張題目時，仍必須逐列選對圖片。不能確定的題目選「不儲存」。</p><p id="summary" aria-live="polite"></p></section>
<section id="list" class="panel" hidden><h2>2. 對照題目照片，確認配對</h2><div id="rows"></div><button id="saveAll">確認配對後，批次私密儲存</button><p id="result" aria-live="polite"></p><p class="muted">批次儲存不會公布答案。像 70403 有兩張題目，請在右側下拉選單選「70403／第 1 張」或「第 2 張」，並比對顯微鏡照片。請回老師控制台決定何時公布。相同題目編號若重新上傳，會覆蓋先前照片；若目前已公開則會先隱藏舊答案照片。</p></section></main>
<script src="data.js?v=20261031c"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.database(),el=id=>document.getElementById(id);const PHOTOS=window.PHOTOS;
const classes=[...new Set(PHOTOS.map(p=>p.class||p.seat.slice(0,3)))].sort();
classes.forEach(c=>el('class').add(new Option(c+' 班',c)));
let queue=[];
function compress(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image;img.onload=()=>{URL.revokeObjectURL(url);let size=750,ratio=Math.min(1,size/Math.max(img.naturalWidth,img.naturalHeight));let canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*ratio);canvas.height=Math.round(img.naturalHeight*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data='';for(let i=0;i<15;i++){data=canvas.toDataURL('image/jpeg',Math.max(.42,.8-i*.035));if(data.length<135000)break;let w=canvas.width,h=canvas.height;let tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').drawImage(canvas,0,0);canvas.width=Math.max(1,Math.round(w*.9));canvas.height=Math.max(1,Math.round(h*.9));ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(tmp,0,0,canvas.width,canvas.height)}data.length<135000?resolve(data):reject(Error('無法壓縮 '+file.name))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('圖片讀取失敗 '+file.name))};img.src=url})}
function draw(){let photos=PHOTOS.filter(p=>(p.class||p.seat.slice(0,3))===el('class').value);el('rows').innerHTML='';for(const [i,q] of queue.entries()){let row=document.createElement('div');row.className='pair';let thumb=document.createElement('img');thumb.src=q.preview;thumb.alt='答案照片';row.append(thumb);let question=document.createElement('img');question.alt='選擇的顯微鏡題目';row.append(question);let box=document.createElement('div');let name=document.createElement('div');name.textContent=q.file.name;name.className='muted';box.append(name);let select=document.createElement('select');select.setAttribute('aria-label','選擇對應顯微鏡題目');select.add(new Option('不儲存／尚未配對',''));for(let p of photos)select.add(new Option(p.seat+'／第 '+Number(p.id.split('_').pop())+' 張：'+p.filename,p.id));const m=q.file.name.match(/(70[1-5]\d{2})/);let possible=m?photos.filter(p=>p.seat===m[1]):[];if(possible.length===1)select.value=possible[0].id;else select.value='';const sync=()=>{q.id=select.value;let p=photos.find(p=>p.id===q.id);if(p){question.src=p.src;status.textContent='已選 '+p.id;}else{question.removeAttribute('src');status.textContent=possible.length>1?'此座號有多張題目，請選第1張或第2張':'尚未配對';}updateSummary()};select.addEventListener('change',sync);box.append(select);row.append(box);let status=document.createElement('div');status.className='muted status';status.textContent='需核對';row.append(status);el('rows').append(row);q.status=status;sync()}}
function updateSummary(){let matched=queue.filter(q=>q.id);let dups=matched.map(q=>q.id).filter((id,i,a)=>a.indexOf(id)!==i);el('summary').textContent='已選 '+queue.length+' 張；已配對 '+matched.length+' 張；未配對 '+(queue.length-matched.length)+' 張'+(dups.length?'；有重複題目編號，請檢查！':'');el('saveAll').disabled=!!dups.length||!matched.length}
el('files').addEventListener('change',async e=>{if(!firebase.auth().currentUser){alert('請先登入');return}queue=[...e.target.files].map(file=>({file,preview:URL.createObjectURL(file),id:''}));el('list').hidden=!queue.length;draw()});
el('class').addEventListener('change',draw);
el('saveAll').onclick=async()=>{if(!firebase.auth().currentUser)return alert('請先登入');let matched=queue.filter(q=>q.id);if(!matched.length)return;if(new Set(matched.map(q=>q.id)).size!==matched.length)return alert('同一題不能配對多張答案照片');if(!confirm('確定私密儲存 '+matched.length+' 張答案照片？尚不會公開。'))return;el('saveAll').disabled=true;let ok=0,fail=0;for(let q of matched){try{q.status.textContent='正在壓縮及儲存…';let data=await compress(q.file);await db.ref('live/answerImages/'+q.id).remove();await db.ref('private/answerImages/'+q.id).set(data);q.status.textContent='✓ 已私密儲存';ok++}catch(e){q.status.textContent='失敗：'+e.message;fail++}}el('result').textContent='完成：成功 '+ok+' 張、失敗 '+fail+' 張。請逐列確認。';el('saveAll').disabled=false};
el('login').onclick=async()=>{try{await firebase.auth().signInWithEmailAndPassword(el('email').value.trim(),el('password').value);el('password').value=''}catch(e){alert(e.message)}};
el('logout').onclick=()=>firebase.auth().signOut();
firebase.auth().onAuthStateChanged(u=>{el('authStatus').textContent=u?'已登入：'+u.email:'尚未登入';el('manage').hidden=!u;el('list').hidden=!u||!queue.length});
</script></html>
