<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顯微鏡猜猜樂｜新增題目</title><link rel="stylesheet" href="style.css"><style>main{max-width:900px}.panel{background:#fff;border-radius:14px;padding:20px;margin-bottom:15px}.flex{display:flex;gap:12px;flex-wrap:wrap}.flex label{display:flex;flex-direction:column;gap:5px}.flex select{min-width:130px}.preview{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.preview img{width:100%;height:230px;object-fit:contain;background:#eef2f7;border-radius:10px}.muted{color:#54677c;font-size:14px}.good{color:#18703c;font-weight:bold}@media(max-width:600px){.preview{grid-template-columns:1fr}}</style></head><body><header><h1>🔬 顯微鏡猜猜樂｜新增學生題目</h1><p>選班級座號、上傳補交照片，自動建立下一題；不更動原本題目和答案。</p><a href="teacher.html" style="color:white">← 老師控制台</a></header><main><section class="panel"><div class="flex"><input id="email" type="email" placeholder="教師電子郵件"><input id="password" type="password" placeholder="教師密碼"><button id="login">登入</button><button id="logout" class="alt" hidden>登出</button></div><p id="auth" class="muted">尚未登入</p></section><section class="panel" id="manager" hidden><h2>補交／新增題目照片</h2><div class="flex"><label>班級<select id="cls"></select></label><label>座號<select id="seat"></select></label><label>照片（可一次選多張）<input id="photos" type="file" accept="image/*" multiple></label></div><p class="muted">學生座號：01～09、21～32。即使原本沒有繳交也可以選。照片會壓縮為網頁版；原始照片請另外備份。</p><p id="existing" class="muted"></p><div class="preview"><div><h3>新照片預覽</h3><div id="previews"></div></div><div><h3>目前該座號的題目</h3><div id="existingPhotos"></div></div></div><button id="upload">確認新增題目（直接公開）</button><p class="muted">新題目會立即出現在學生網頁，答案仍保持隱藏。請不要在需要保密題目的上課期間新增。</p><p id="msg" aria-live="polite"></p></section></main><script src="data.js?v=20261031b"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>
firebase.initializeApp(window.FIREBASE_CONFIG);const db=firebase.database(),E=id=>document.getElementById(id);let added={},busy=false;
const classes=['701','702','703','704','705'];const seats=[...Array.from({length:9},(_,i)=>String(i+1).padStart(2,'0')),...Array.from({length:12},(_,i)=>String(i+21))];
classes.forEach(x=>E('cls').add(new Option(x,x)));seats.forEach(x=>E('seat').add(new Option(x,x)));
const questionList=()=>[...window.PHOTOS,...Object.values(added)];
function info(){let seat=E('cls').value+E('seat').value;let list=questionList().filter(x=>x.seat===seat);E('existing').textContent=seat+'：目前 '+list.length+' 張題目；新增時自動編號為第 '+(Math.max(0,...list.map(x=>Number(x.id.split('_').pop())||0))+1)+' 張。';E('existingPhotos').replaceChildren();list.forEach(p=>{let box=document.createElement('div');box.style.cssText='display:inline-block;width:46%;padding:5px;vertical-align:top';let img=document.createElement('img');img.src=p.src;img.style.cssText='width:100%;height:125px;object-fit:contain';let t=document.createElement('div');t.textContent=p.id;box.append(img,t);E('existingPhotos').append(box)})}
E('cls').onchange=info;E('seat').onchange=info;E('photos').onchange=e=>{E('previews').replaceChildren();for(const f of e.target.files){let img=document.createElement('img');img.src=URL.createObjectURL(f);img.style.cssText='width:46%;height:125px;object-fit:contain;margin:2%';img.onload=()=>URL.revokeObjectURL(img.src);E('previews').append(img)}};
function compress(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(u);let k=Math.min(1,750/Math.max(img.naturalWidth,img.naturalHeight));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let data='';for(let i=0;i<16;i++){data=c.toDataURL('image/jpeg',Math.max(.42,.8-i*.035));if(data.length<=135000)break;let copy=document.createElement('canvas');copy.width=c.width;copy.height=c.height;copy.getContext('2d').drawImage(c,0,0);c.width=Math.max(1,Math.round(c.width*.9));c.height=Math.max(1,Math.round(c.height*.9));ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(copy,0,0,c.width,c.height)}data.length<=135000?resolve(data):reject(Error('照片無法壓縮：'+file.name))};img.onerror=()=>reject(Error('照片讀取失敗：'+file.name));img.src=u})}
E('upload').onclick=async()=>{if(busy)return;if(!firebase.auth().currentUser)return alert('請先登入');let list=[...E('photos').files];if(!list.length)return alert('請先選照片');let seat=E('cls').value+E('seat').value;if(!confirm('確認為 '+seat+' 新增 '+list.length+' 張題目？新增後學生端立即可見。'))return;busy=true;E('upload').disabled=true;let success=0;try{for(let f of list){let snap=await db.ref('live/extraQuestions').once('value');added=snap.val()||{};const numbers=questionList().filter(p=>p.seat===seat).map(p=>Number(p.id.split('_').pop())||0);let next=Math.max(0,...numbers)+1;let id=seat+'_'+String(next).padStart(2,'0');let src=await compress(f);let item={id,seat,class:E('cls').value,src,filename:f.name.slice(0,90)};await db.ref('live/extraQuestions/'+id).set(item);added[id]=item;success++;E('msg').textContent='新增成功：'+id+'（'+success+'/'+list.length+'）'}E('photos').value='';E('previews').replaceChildren();info()}catch(e){E('msg').textContent='已有 '+success+' 張成功；後續失敗：'+e.message}finally{busy=false;E('upload').disabled=false}};
E('login').onclick=async()=>{try{await firebase.auth().signInWithEmailAndPassword(E('email').value.trim(),E('password').value);E('password').value=''}catch(e){alert(e.message)}};E('logout').onclick=()=>firebase.auth().signOut();
firebase.auth().onAuthStateChanged(u=>{E('auth').textContent=u?'已登入：'+u.email:'尚未登入';E('manager').hidden=!u;E('login').hidden=!!u;E('logout').hidden=!u});
db.ref('live/extraQuestions').on('value',s=>{added=s.val()||{};info()},e=>E('msg').textContent='新題目讀取失敗，請先發布新版資料庫規則：'+e.message);info();
</script></body></html>
