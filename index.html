<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>704 顯微鏡猜猜樂｜學生版</title><link rel="stylesheet" href="style.css"><body data-mode="student"><header><h1>🔬 704 顯微鏡猜猜樂</h1><p>觀察細節，猜猜照片裡的物品。答案由老師控制公布。</p></header><main><div class="notice" id="offline">目前為照片預覽模式：尚未連接 Firebase，老師遠端公布答案功能未啟用。</div><div class="toolbar"><label>座號 <select id="seat"></select></label><span id="count"></span><span id="status"></span></div><div id="cards" class="grid"></div><p class="small">猜測文字僅留在自己的平板，不會上傳。切換篩選條件會清空文字。</p></main><dialog id="zoom"><button id="closeZoom">關閉</button><p><img id="zoomimg" alt="放大照片"></p></dialog><script src="data.js?v=20261030b"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="common.js"></script><script>init();const visible={};function render(){window.PHOTOS.forEach(p=>{let el=document.getElementById('r_'+p.id);if(!el)return;const a=visible[p.id];el.classList.toggle('hidden',typeof a!=='string');el.textContent=typeof a==='string'?'答案：'+a:'';});}$('#seat').addEventListener('change',render);if(dbReady){$('#offline').classList.add('hidden');firebase.database().ref('live/revealed').on('value',s=>{Object.keys(visible).forEach(k=>delete visible[k]);Object.assign(visible,s.val()||{});render();$('#status').textContent='✓ 已連接老師即時公布狀態';},e=>{$('#status').textContent='無法讀取答案狀態：'+e.message;});}</script></body></html>
