<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四班顯微鏡猜猜樂｜學生版</title><link rel="stylesheet" href="style.css"><body data-mode="student"><header><h1>🔬 四班顯微鏡猜猜樂</h1><p>701、703、704、705 四班題目整合。觀察細節，猜猜照片裡的物品；答案與答案照片由老師控制公布。</p></header><main><div class="notice" id="offline">目前為照片預覽模式：尚未連接 Firebase，老師遠端公布答案功能未啟用。</div><div class="toolbar"><label>班級 <select id="classFilter"></select></label><label>座號 <select id="seat"></select></label><span id="count"></span><span id="status"></span></div><div id="cards" class="grid"></div><p class="small">學生可先自由猜測。切換班級或座號時，你輸入的猜測文字不會上傳，只留在本機。</p></main><dialog id="zoom"><button id="closeZoom">關閉</button><p><img id="zoomimg" alt="放大照片"></p></dialog><script src="data.js?v=20261031b"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="common.js?v=20261031a"></script><script>
init();
const visible={};
const photoVisible={};
function render(){
  window.PHOTOS.forEach(p=>{
    const textBox=document.getElementById('r_'+p.id);
    if(!textBox)return;
    const answer=visible[p.id];
    textBox.classList.toggle('hidden',typeof answer!=='string');
    textBox.textContent=typeof answer==='string'?'答案：'+answer:'';
    let photoBox=document.getElementById('answer-photo-'+p.id);
    if(!photoBox){
      photoBox=document.createElement('div');
      photoBox.id='answer-photo-'+p.id;
      photoBox.className='answer-photo hidden';
      photoBox.style.cssText='margin-top:10px;border-radius:10px;padding:8px;background:#ebf8ec';
      const label=document.createElement('strong');
      label.textContent='📷 物品原貌（正確答案）';
      photoBox.appendChild(label);
      const img=document.createElement('img');
      img.alt=p.seat+' 的答案照片';
      img.loading='lazy';
      img.style.cssText='display:block;width:100%;height:auto;max-height:360px;object-fit:contain;margin-top:8px;border-radius:8px;background:#fff;cursor:zoom-in';
      img.onclick=()=>{document.getElementById('zoomimg').src=img.src;document.getElementById('zoom').showModal()};
      photoBox.appendChild(img);
      textBox.insertAdjacentElement('afterend',photoBox);
    }
    const image=photoVisible[p.id];
    const valid=typeof image==='string'&&image.startsWith('data:image/jpeg;base64,')&&image.length<=150000;
    photoBox.classList.toggle('hidden',!valid);
    const img=photoBox.querySelector('img');
    if(valid&&img.src!==image)img.src=image;
    if(!valid)img.removeAttribute('src');
  });
}
window.afterCardsRendered=render;
if(dbReady){
  document.getElementById('offline').classList.add('hidden');
  firebase.database().ref('live/revealed').on('value',snapshot=>{
    Object.keys(visible).forEach(k=>delete visible[k]);
    Object.assign(visible,snapshot.val()||{});
    render();
    document.getElementById('status').textContent='✓ 已連接老師即時公布狀態';
  },error=>{document.getElementById('status').textContent='文字答案讀取失敗：'+error.message});
  firebase.database().ref('live/answerImages').on('value',snapshot=>{
    Object.keys(photoVisible).forEach(k=>delete photoVisible[k]);
    Object.assign(photoVisible,snapshot.val()||{});
    render();
  },error=>{console.warn('答案照片讀取權限待設定',error.message)});
}
</script></body></html>
