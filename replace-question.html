<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顯微鏡猜猜樂｜更換題目照片</title><link rel="stylesheet" href="style.css"><style>main{max-width:960px}.panel{background:white;padding:18px;border-radius:14px;margin:15px 0}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls label{display:flex;flex-direction:column;gap:5px}.controls select{min-width:140px;max-width:300px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare img{width:100%;height:280px;object-fit:contain;background:#edf2f6;border-radius:9px}.notice{padding:10px;background:#fff5df;border-radius:8px}.status{font-weight:600;color:#14643d}@media(max-width:680px){.compare{grid-template-columns:1fr}.compare img{height:190px}}</style></head><body><header><h1>🔬 顯微鏡猜猜樂｜更換題目照片</h1><p>保留座號和題目編號、更換錯誤題目照片；可隨時恢復原圖。</p><a href="overview.html" style="color:white">← 作業總覽</a></header><main><section class="panel"><div class="controls"><input id="email" type="email" placeholder="教師電子郵件"><input id="password" type="password" placeholder="登入密碼"><button id="login">登入</button><button id="logout" class="alt" hidden>登出</button><span id="auth">尚未登入</span></div></section><section class="panel" id="panel" hidden><h2>選擇需要更換的題目</h2><div class="controls"><label>班級<select id="cls"></select></label><label>座號<select id="seat"></select></label><label>題目<select id="question"></select></label></div><p id="idInfo"></p><div class="compare"><div><h3>目前學生看到的題目</h3><img id="current" alt="目前題目"><p id="currentInfo"></p></div><div><h3>新照片預覽</h3><img id="preview" alt="新照片"><label>選擇正確題目照片 <input type="file" id="file" accept="image/*"></label></div></div><p id="answerWarn" class="notice"></p><div class="controls"><button id="save">確認替換題目照片</button><button id="restore" class="alt">恢復原本照片</button></div><p id="status" aria-live="polite"></p><p class="notice">替換時只會更換題目圖片；原本答案照片及文字答案都會保留，請核對答案是否仍正確。「恢復原本照片」只移除替換設定，不刪除原始題目。新增／補交題目的原圖也會保留。</p></section></main>
<script src="data.js?v=20261031b"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
'use strict';firebase.initializeApp(window.FIREBASE_CONFIG);
const db=firebase.database(),E=id=>document.getElementById(id),base=window.PHOTOS;
let extra={},overrides={},answers={},busy=false,draft=null,selectVersion=0;
const seats=[...Array.from({length:9},(_,i)=>String(i+1).padStart(2,'0')),...Array.from({length:12},(_,i)=>String(i+21))];
['701','702','703','704','705'].forEach(x=>E('cls').add(new Option(x+' 班',x)));
seats.forEach(x=>E('seat').add(new Option(x,x)));
const questions=()=>[...base,...Object.values(extra)].sort((a,b)=>a.seat.localeCompare(b.seat)||Number(a.id.split('_').pop())-Number(b.id.split('_').pop()));
const selected=()=>questions().find(x=>x.id===E('question').value);
function refreshQuestions(){const previous=E('question').value,arr=questions().filter(x=>x.seat===E('cls').value+E('seat').value);E('question').replaceChildren();for(const q of arr)E('question').add(new Option(q.id+'｜'+q.filename,q.id));if(arr.some(x=>x.id===previous))E('question').value=previous;refreshSelection()}
function refreshSelection(){selectVersion++;draft=null;E('file').value='';E('preview').removeAttribute('src');const p=selected();E('save').disabled=!p;E('restore').disabled=!p||!overrides[p.id];if(!p){E('idInfo').textContent='這位學生目前沒有題目，可到新增題目頁補交。';E('current').removeAttribute('src');E('answerWarn').textContent='';return}E('idInfo').textContent='題目編號：'+p.id;E('current').src=overrides[p.id]||p.src;E('currentInfo').textContent=overrides[p.id]?'目前顯示替換後的照片；可恢復原圖':'目前顯示原始照片';E('answerWarn').textContent=answers[p.id]?'⚠️ 這題已保存答案照片。替換題目後，請再次確認答案是否仍相符；不會自動刪除答案。':'這題尚未保存答案照片。'}
E('cls').onchange=refreshQuestions;E('seat').onchange=refreshQuestions;E('question').onchange=refreshSelection;
E('file').onchange=e=>{const file=e.target.files[0];draft=file||null;if(!file){E('preview').removeAttribute('src');return}const url=URL.createObjectURL(file);E('preview').onload=()=>URL.revokeObjectURL(url);E('preview').src=url};
function compress(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);let ratio=Math.min(1,750/Math.max(img.naturalWidth,img.naturalHeight));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*ratio));c.height=Math.max(1,Math.round(img.naturalHeight*ratio));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let data='';for(let k=0;k<18;k++){data=c.toDataURL('image/jpeg',Math.max(.42,.8-k*.035));if(data.length<=135000)break;let copy=document.createElement('canvas');copy.width=c.width;copy.height=c.height;copy.getContext('2d').drawImage(c,0,0);c.width=Math.max(1,Math.round(c.width*.9));c.height=Math.max(1,Math.round(c.height*.9));ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(copy,0,0,c.width,c.height)}data.length<=135000?resolve(data):reject(Error('照片無法壓縮到限制大小'))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('照片讀取失敗'))};img.src=url})}
E('save').onclick=async()=>{const p=selected();if(!p||!draft)return alert('請先選擇新照片');if(!firebase.auth().currentUser)return alert('請先登入');const id=p.id,file=draft;if(!confirm('確定更換 '+id+' 的題目照片？題號不變，已保存的答案仍保留。'))return;busy=true;E('save').disabled=true;try{E('status').textContent='正在壓縮並儲存…';const data=await compress(file);await db.ref('live/questionOverrides/'+id).set(data);overrides[id]=data;E('status').textContent='✓ 已替換 '+id+'；學生端會同步看到新照片。';refreshSelection()}catch(e){E('status').textContent='替換失敗：'+e.message}finally{busy=false;E('save').disabled=false}};
E('restore').onclick=async()=>{const p=selected();if(!p||!overrides[p.id])return;if(!confirm('恢復 '+p.id+' 的原始題目照片？'))return;try{await db.ref('live/questionOverrides/'+p.id).remove();delete overrides[p.id];E('status').textContent='已恢復 '+p.id+' 原始照片';refreshSelection()}catch(e){E('status').textContent='恢復失敗：'+e.message}};
E('login').onclick=async()=>{try{await firebase.auth().signInWithEmailAndPassword(E('email').value.trim(),E('password').value);E('password').value=''}catch(e){alert(e.message)}};E('logout').onclick=()=>firebase.auth().signOut();
firebase.auth().onAuthStateChanged(async user=>{E('auth').textContent=user?'已登入：'+user.email:'尚未登入';E('panel').hidden=!user;E('login').hidden=!!user;E('logout').hidden=!user;if(!user){answers={};return}try{const s=await db.ref('private/answerImages').once('value');answers=s.val()||{};refreshSelection()}catch(e){E('status').textContent='答案照片檢查失敗：'+e.message}});
db.ref('live/extraQuestions').on('value',s=>{extra=s.val()||{};refreshQuestions()},e=>E('status').textContent=e.message);
db.ref('live/questionOverrides').on('value',s=>{overrides=s.val()||{};refreshSelection()},e=>E('status').textContent='請先發布新版 Firebase 規則：'+e.message);
refreshQuestions();
</script></body></html>
