<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顯微鏡猜猜樂｜老師上傳答案照片</title><link rel="stylesheet" href="style.css"><style>.upload-wrap{max-width:1040px;margin:0 auto}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.upload-panel{background:#fff;border:1px solid #dce3eb;border-radius:14px;padding:18px}.upload-panel h2{font-size:19px;margin:0 0 12px}.upload-panel img{display:block;width:100%;height:260px;object-fit:contain;background:#eef3f7;border-radius:10px}.upload-panel label{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:10px 0}.upload-panel select,.upload-panel input[type=file]{width:100%;max-width:100%}.upload-help{color:#546779;line-height:1.65;font-size:14px}.actionbar{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.actionbar button{flex:1;min-width:125px}.danger{background:#fce4e4!important;color:#8b1721!important}.pillnote{border-radius:9px;padding:9px 12px;background:#e9f4f9;color:#10476c;margin:10px 0;line-height:1.5}.pillsaved{background:#e7f6e9;color:#146633}.pillwarn{background:#fff3d9;color:#754c0b}.login-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.login-row input{flex:1;min-width:185px}#uploadMsg{min-height:26px;font-weight:600;margin:12px 0}.nav-back{display:inline-block;margin-top:8px;color:#e8f4ff}@media(max-width:720px){.upload-grid{grid-template-columns:1fr}.upload-panel img{height:220px}}</style></head><body><header><h1>📷 老師上傳答案照片</h1><p>先存私密答案照片，課堂上再公布；換下一班前可以重新隱藏。</p><a class="nav-back" href="teacher.html">← 返回老師答案控制台</a></header><main class="upload-wrap"><div id="loginArea" class="upload-panel"><h2>教師登入</h2><div class="login-row"><input id="email" type="email" autocomplete="username" placeholder="教師 Firebase 電子郵件"><input id="password" type="password" autocomplete="current-password" placeholder="教師登入密碼"><button id="signIn">登入</button><button class="alt hidden" id="signOut">登出</button></div><p id="authStatus" class="upload-help">正在連接 Firebase…</p></div><p id="uploadMsg" aria-live="polite"></p><section id="manage" class="hidden"><div class="upload-grid"><div class="upload-panel"><h2>① 選擇要配對的題目</h2><label>班級 <select id="classFilter"></select></label><label>題目 <select id="question"></select></label><img id="questionImage" alt="顯微鏡題目照片"><p id="questionInfo" class="upload-help"></p></div><div class="upload-panel"><h2>② 上傳物品原貌照片</h2><p class="upload-help">選學生拍攝的答案照片。照片會自動壓縮為課堂展示縮圖，原始照片不會上傳 GitHub。</p><label>答案照片 <input id="file" type="file" accept="image/*"></label><img id="answerImage" alt="答案照片預覽"><p id="imageInfo" class="upload-help">尚未選擇答案照片。</p><div id="savedInfo" class="pillnote pillwarn">讀取保存狀態中…</div><div class="actionbar"><button id="save">儲存照片（不公開）</button><button id="reveal">公布這張答案照片</button><button class="alt" id="hide">重新隱藏</button></div><div class="actionbar"><button id="delete" class="danger">刪除這張答案照片</button></div></div></div><div class="upload-panel" style="margin-top:18px"><h2>③ 整班課程控制</h2><p class="upload-help">「公布所有照片答案」會將已儲存的答案照片一起顯示在學生版；「全部重新隱藏」會同時隱藏文字及照片答案，但保留老師私密儲存的照片。</p><div class="actionbar"><button id="revealAll">公布所有已儲存的照片答案</button><button class="alt" id="hideAll">全部重新隱藏（文字＋照片）</button></div><p class="upload-help">提示：文字答案仍可在原本 <a href="teacher.html">老師管理頁</a> 輸入與公布。這個頁面是另外管理答案照片。</p></div></section></main><script src="data.js?v=20261031c"></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>(function(){'use strict';var el=function(id){return document.getElementById(id)};var all=Array.isArray(window.PHOTOS)?window.PHOTOS:[];var db=null,draft=null,fileDraft=null,selection=0;function msg(s,error){el('uploadMsg').textContent=s;el('uploadMsg').style.color=error?'#a21927':'#16643a'}function ensureTeacher(){if(!firebase.auth().currentUser)throw new Error('請先登入教師帳號')}function current(){return all.find(function(p){return p.id===el('question').value})}function label(p){var n=p.id.split('_').pop();return (p.class||p.seat.slice(0,3))+' 班｜'+p.seat+'｜第 '+Number(n)+' 張（'+p.filename+'）'}function option(value,labelText){var o=document.createElement('option');o.value=value;o.textContent=labelText;return o}function setup(){var classes=[...new Set(all.map(function(p){return p.class||p.seat.substring(0,3)}))].sort();el('classFilter').innerHTML='';classes.forEach(function(c){el('classFilter').appendChild(option(c,c+' 班'))});if(!classes.length){msg('找不到題目資料 data.js',true);return}el('classFilter').addEventListener('change',questions);el('question').addEventListener('change',loadQuestion);questions()}function questions(){var set=all.filter(function(p){return (p.class||p.seat.substring(0,3))===el('classFilter').value});var box=el('question');box.innerHTML='';set.forEach(function(p){box.appendChild(option(p.id,label(p)))});loadQuestion()}function refs(id){return {private:db.ref('private/answerImages/'+id),public:db.ref('live/answerImages/'+id)}}async function loadQuestion(){var p=current();selection++;draft=null;fileDraft=null;el('file').value='';el('answerImage').removeAttribute('src');el('imageInfo').textContent='尚未選擇答案照片。';if(!p)return;el('questionImage').src=p.src;el('questionInfo').textContent='題目編號：'+p.id+'。請核對顯微鏡照片後再配對答案。';el('savedInfo').textContent='正在讀取已保存的答案…';el('savedInfo').className='pillnote pillwarn';var myTurn=selection;try{var r=refs(p.id);var snapshots=await Promise.all([r.private.once('value'),r.public.once('value')]);if(myTurn!==selection)return;draft=snapshots[0].val();var publicPhoto=snapshots[1].val();if(draft&&typeof draft==='string'){el('answerImage').src=draft;el('imageInfo').textContent='已載入老師私密保存的答案照片；可選新照片覆蓋。'}el('savedInfo').textContent=(draft?'✓ 已私密保存':'尚未保存答案照片')+'　｜　'+(publicPhoto?'目前已公布':'目前隱藏');el('savedInfo').className='pillnote '+(publicPhoto?'pillsaved':'pillwarn')}catch(e){if(myTurn!==selection)return;el('savedInfo').textContent='讀取失敗：'+e.message+'。請確認 Firebase 規則已更新。';el('savedInfo').className='pillnote pillwarn'}}function compress(file){return new Promise(function(resolve,reject){if(!file||!file.type.startsWith('image/'))return reject(new Error('請選擇圖片檔'));var url=URL.createObjectURL(file),image=new Image();image.onload=function(){URL.revokeObjectURL(url);var max=750,scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));var canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));var ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);var data='';for(var i=0;i<16;i++){data=canvas.toDataURL('image/jpeg',Math.max(.42,.78-i*.035));if(data.length<=135000)break;canvas.width=Math.max(1,Math.round(canvas.width*.90));canvas.height=Math.max(1,Math.round(canvas.height*.90));ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height)}if(data.length>135000)return reject(new Error('照片無法壓縮到限制大小，請換一張照片'));resolve(data)};image.onerror=function(){URL.revokeObjectURL(url);reject(new Error('無法讀取這張照片，請改用 JPG 或 PNG 格式'))};image.src=url})}el('file').addEventListener('change',async function(){var f=this.files[0];if(!f)return;var myTurn=selection;fileDraft=null;try{msg('正在壓縮照片…');var data=await compress(f);if(myTurn!==selection)return;fileDraft=data;el('answerImage').src=data;el('imageInfo').textContent='新照片已預覽：'+Math.ceil(data.length*.75/1024)+' KB。請按「儲存照片（不公開）」。';msg('照片已壓縮，但尚未上傳 Firebase。')}catch(e){msg(e.message,true)}});async function updateSelected(task){ensureTeacher();var p=current();if(!p)throw new Error('請先選擇題目');var id=p.id,r=refs(id);if(task==='save'){if(!fileDraft)throw new Error('請先選取答案照片');await r.public.remove();await r.private.set(fileDraft);msg(id+' 的答案照片已私密儲存，尚未公布。')}else if(task==='reveal'){var value=null;if(!value){var shot=await r.private.once('value');value=shot.val()}if(!value)throw new Error('請先按「儲存照片（不公開）」');await r.public.set(value);msg(id+' 的答案照片已公布，學生平板應同步看到。')}else if(task==='hide'){await r.public.remove();msg(id+' 的答案照片已重新隱藏。')}else if(task==='delete'){if(!confirm('確定永久刪除 '+id+' 的答案照片嗎？私密保存的照片也會刪除。'))return;await r.public.remove();await r.private.remove();msg(id+' 的答案照片已刪除。')}if(current()&&current().id===id)await loadQuestion()}['save','reveal','hide','delete'].forEach(function(task){el(task).addEventListener('click',async function(){this.disabled=true;try{await updateSelected(task)}catch(e){msg(e.message,true)}finally{this.disabled=false}})});el('revealAll').onclick=async function(){if(!confirm('確定將所有已儲存的答案照片公布給學生嗎？'))return;this.disabled=true;try{ensureTeacher();var s=await db.ref('private/answerImages').once('value');var data=s.val()||{},n=Object.keys(data).length;if(!n)throw new Error('目前沒有已保存的答案照片');await db.ref('live/answerImages').set(data);msg('已同步公布 '+n+' 張答案照片。');await loadQuestion()}catch(e){msg(e.message,true)}finally{this.disabled=false}};el('hideAll').onclick=async function(){if(!confirm('確定全部重新隱藏？學生端的文字答案與照片答案都會消失，老師私密保存的答案照片仍保留。'))return;this.disabled=true;try{ensureTeacher();await db.ref('live/revealed').remove();await db.ref('live/answerImages').remove();msg('所有文字與照片答案已重新隱藏，可讓下一班重新猜題。');await loadQuestion()}catch(e){msg('操作未完全成功：'+e.message,true)}finally{this.disabled=false}};if(!window.FIREBASE_CONFIG){msg('沒有 Firebase 設定，請確認 firebase-config.js 存在',true);return}try{firebase.initializeApp(window.FIREBASE_CONFIG)}catch(e){msg('連線設定錯誤：'+e.message,true);return}db=firebase.database();el('signIn').onclick=async function(){try{await firebase.auth().signInWithEmailAndPassword(el('email').value.trim(),el('password').value);el('password').value='';msg('教師登入成功。')}catch(e){msg('登入失敗：'+e.message,true)}};el('signOut').onclick=function(){firebase.auth().signOut()};firebase.auth().onAuthStateChanged(function(user){el('manage').classList.toggle('hidden',!user);el('signIn').classList.toggle('hidden',!!user);el('signOut').classList.toggle('hidden',!user);el('authStatus').textContent=user?'已登入：'+user.email+'。可以私密上傳答案照片。':'尚未登入，只有老師能上傳、公布或隱藏答案照片。';if(user){setupOnce()}else{selection++;draft=null;fileDraft=null}});var initialized=false;function setupOnce(){if(initialized){loadQuestion();return}initialized=true;setup()}
 firebase.database().ref('live/extraQuestions').on('value',snap=>{
 let extra=Object.values(snap.val()||{});
 window.PHOTOS.splice(0,window.PHOTOS.length,...window.PHOTOS.filter(p=>!p.dynamic),...extra.map(p=>({...p,dynamic:true})));window.PHOTOS.sort((a,b)=>a.seat.localeCompare(b.seat)||Number(a.id.split('_').pop())-Number(b.id.split('_').pop()));window.PHOTOS.forEach(p=>{if(!p.originalSrc)p.originalSrc=p.src;p.src=(window.questionImageOverrides||{})[p.id]||p.originalSrc;});
 all=window.PHOTOS; if(typeof initialized!=='undefined'&&initialized) questions();
 },e=>console.warn('新題目未啟用',e.message));

 firebase.database().ref('live/questionOverrides').on('value',snap=>{
 const overrides=snap.val()||{};window.questionImageOverrides=overrides;
 window.PHOTOS.forEach(p=>{if(!p.originalSrc)p.originalSrc=p.src;p.src=overrides[p.id]||p.originalSrc;});
 if(typeof initialized!=='undefined'&&initialized)loadQuestion();
 },err=>console.warn('題目照片替換尚未啟用：'+err.message));
})();</script></body></html>
